# Security audit F-11 (28 Oct 2026): weekly update proposals for the pinned GitHub Actions. Dependabot only opens pull
# requests; nothing is merged automatically. Major versions are not proposed (they change behaviour and need a planned
# upgrade). Every proposal must also add the new commit SHA to the reviewed allowlist in desk/_tests/p0.test.mjs
# (test "B4: every workflow action is pinned to an approved full commit SHA"), so CI fails until a person reviews it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
