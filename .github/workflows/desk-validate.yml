name: Nexus Desk validation
# Runs the Desk data validator and test suite. Free on public repositories.
# Validation does not deploy anything. It is also called by desk-pages-deploy.yml, which deploys only after it passes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow (media derivatives in lifecycle tests)
        run: pip install pillow==11.0.0
      - name: Validate Desk data, fixtures, media, method registry and parent-site manifest
        run: node desk/_tools/validate.mjs
      - name: Check generated Desk pages are up to date
        run: node desk/_tools/build.mjs --check
      - name: Run Desk test suites (unit rules, ingestion lifecycle, P0 regressions, Phase 2 integrity)
        run: node --test desk/_tests/desk.test.mjs desk/_tests/p0.test.mjs desk/_tests/phase2.test.mjs desk/_tests/p1.test.mjs desk/_tests/closure.test.mjs desk/_tests/engines.test.mjs
  pages-build-check:
    # Reproduces the real GitHub Pages build (same builder as pages-build-deployment) WITHOUT deploying,
    # then tests the built site served at the domain root, as nexus-ways.com serves it.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build with the GitHub Pages builder (no deployment)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check published tree, routes, links and data
        run: python3 desk/_tests/pages_check.py _site
      - name: Install Playwright (Chromium)
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Browser checks against the Pages build
        env:
          SITE_DIR: _site
          PAGES_MODE: '1'
        run: python3 desk/_tests/ui_acceptance.py
  fixture-browser-check:
    # Illustrative fixtures in a browser, from the SOURCE tree on a local server: never the published build, never
    # deployed. Kept separate from pages-build-check, which tests the production build with fixtures absent.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Playwright (Chromium)
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Browser checks in production and fixture mode (local server, source tree)
        run: python3 desk/_tests/ui_acceptance.py
