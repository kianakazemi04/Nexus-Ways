name: Nexus Desk validation
# Runs the Desk data validator and test suite. Free on public repositories.
# Validation does not deploy anything; GitHub Pages deployment from main is unchanged.
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (media derivatives in lifecycle tests)
        run: pip install pillow==11.0.0
      - name: Validate Desk data, fixtures, media, method registry and parent-site manifest
        run: node desk/_tools/validate.mjs
      - name: Check generated Desk pages are up to date
        run: node desk/_tools/build.mjs --check
      - name: Run Desk test suite (unit rules + full ingestion lifecycle)
        run: node --test desk/_tests/desk.test.mjs
  pages-build-check:
    # Reproduces the real GitHub Pages build (same builder as pages-build-deployment) WITHOUT deploying,
    # then tests the built site served at the domain root, as nexus-ways.com serves it.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build with the GitHub Pages builder (no deployment)
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published tree, routes, links and data
        run: python3 desk/_tests/pages_check.py _site
      - name: Install Playwright (Chromium)
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Browser checks against the Pages build
        env:
          SITE_DIR: _site
          PAGES_MODE: '1'
        run: python3 desk/_tests/ui_acceptance.py
